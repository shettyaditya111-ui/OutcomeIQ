<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - OutcomeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h2>Student Management</h2>
    <hr>

    <!-- Feedback messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Add Student Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Add New Student</h5>
            <form action="/addStudent" method="post" class="row g-2">
                <div class="col-md-3">
                    <input type="text" name="usn"
                           class="form-control"
                           placeholder="Enter USN (e.g. 1MS21CS001)" required>
                </div>
                <div class="col-md-5">
                    <input type="text" name="studentName"
                           class="form-control"
                           placeholder="Enter Student Name" required>
                </div>
                <div class="col-md-3">
                    <select name="courseId" class="form-select" required>
                        <option value="">Select Enrolled Course</option>
                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.courseCode + ' - ' + course.courseName}">
                        </option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Student List -->
    <h4>Registered Students</h4>

    <table class="table table-bordered table-hover align-middle mt-3">
        <thead class="table-light">
            <tr>
                <th style="width: 8%;">ID</th>
                <th style="width: 22%;">USN</th>
                <th style="width: 35%;">Student Name</th>
                <th style="width: 20%;">Course</th>
                <th style="width: 15%;">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td><strong class="text-primary" th:text="${student.usn}"></strong></td>
                <td th:text="${student.studentName}"></td>
                <td th:text="${student.course != null ? (student.course.courseCode + ' - ' + student.course.courseName) : '-'}"></td>
                <td>
                    <button type="button" class="btn btn-warning btn-sm me-1"
                            data-bs-toggle="modal" data-bs-target="#editStudentModal"
                            th:data-id="${student.id}"
                            th:data-usn="${student.usn}"
                            th:data-name="${student.studentName}"
                            th:data-course="${student.course != null ? student.course.id : ''}">
                        <i class="bi bi-pencil-square"></i> Edit
                    </button>
                    <a th:href="@{/deleteStudent/{id}(id=${student.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this student record?');">
                        <i class="bi bi-trash"></i> Delete
                    </a>
                </td>
            </tr>
            <tr th:if="${students == null or students.isEmpty()}">
                <td colspan="5" class="text-center text-muted py-3">No students registered yet.</td>
            </tr>
        </tbody>
    </table>

</div>

<!-- Edit Student Modal -->
<div class="modal fade" id="editStudentModal" tabindex="-1" aria-labelledby="editStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/updateStudent" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="editStudentModalLabel"><i class="bi bi-pencil-square me-1"></i> Edit Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editStudentId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">USN</label>
                        <input type="text" name="usn" id="editStudentUsn" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Student Name</label>
                        <input type="text" name="studentName" id="editStudentName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Enrolled Course</label>
                        <select name="courseId" id="editStudentCourseId" class="form-select" required>
                            <option value="">Select Course</option>
                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.courseCode + ' - ' + course.courseName}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('editStudentModal');
        if (modal) {
            modal.addEventListener('show.bs.modal', function(event) {
                const btn = event.relatedTarget;
                document.getElementById('editStudentId').value = btn.getAttribute('data-id');
                document.getElementById('editStudentUsn').value = btn.getAttribute('data-usn');
                document.getElementById('editStudentName').value = btn.getAttribute('data-name');
                document.getElementById('editStudentCourseId').value = btn.getAttribute('data-course');
            });
        }
    });
</script>

</body>
</html>
