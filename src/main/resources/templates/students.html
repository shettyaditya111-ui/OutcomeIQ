<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Management - OutcomeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

    <h2>Student Management</h2>
    <hr>

    <!-- Add Student Form -->
    <form action="/addStudent" method="post">

        <input type="text" name="usn"
               class="form-control mb-3"
               placeholder="Enter USN" required>

        <input type="text" name="studentName"
               class="form-control mb-3"
               placeholder="Enter Student Name" required>

        <select name="courseId" class="form-control mb-3" required>
            <option value="">Select Course</option>

            <option th:each="course : ${courses}"
                    th:value="${course.id}"
                    th:text="${course.courseCode + ' - ' + course.courseName}">
            </option>
        </select>

        <button type="submit" class="btn btn-primary">
            Add Student
        </button>

    </form>

    <hr>

    <!-- Student List -->
    <h3>Registered Students</h3>

    <table class="table table-bordered mt-3">

        <thead>
            <tr>
                <th>ID</th>
                <th>USN</th>
                <th>Student Name</th>
                <th>Course</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.usn}"></td>
                <td th:text="${student.studentName}"></td>
                <td th:text="${student.course.courseCode}"></td>

                <td>
                    <a th:href="@{/deleteStudent/{id}(id=${student.id})}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>

    </table>

    <a href="/" class="btn btn-secondary">Home</a>

</body>
</html>
