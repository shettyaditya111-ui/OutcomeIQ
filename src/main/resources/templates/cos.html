<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Outcome Management - OutcomeIQ</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h2>Course Outcome Management</h2>
    <hr>

    <!-- Feedback messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Add CO Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Add Course Outcome</h5>
            <form action="/addCO" method="post" class="row g-2">
                <div class="col-md-2">
                    <input name="coCode" placeholder="CO Code (e.g. CO1)" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <input name="description" placeholder="Outcome Description" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <select name="courseId" class="form-select" required>
                        <option value="">Select Course</option>
                        <option th:each="c : ${courses}"
                                th:value="${c.id}"
                                th:text="${c.courseCode + ' - ' + c.courseName}">
                        </option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CO List -->
    <h4>Existing Course Outcomes</h4>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
            <tr>
                <th style="width: 8%;">ID</th>
                <th style="width: 15%;">CO Code</th>
                <th style="width: 47%;">Description</th>
                <th style="width: 20%;">Course</th>
                <th class="text-center text-nowrap" style="width: 1%;">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="co : ${cos}">
                <td th:text="${co.id}"></td>
                <td><strong class="text-primary" th:text="${co.coCode}"></strong></td>
                <td th:text="${co.description}"></td>
                <td th:text="${co.course != null ? (co.course.courseCode + ' - ' + co.course.courseName) : 'N/A'}"></td>
                <td class="text-center text-nowrap" style="white-space: nowrap !important;">
                    <div class="d-inline-flex gap-2 align-items-center">
                        <button type="button" class="btn btn-warning btn-sm text-nowrap"
                                data-bs-toggle="modal" data-bs-target="#editCoModal"
                                th:data-id="${co.id}"
                                th:data-code="${co.coCode}"
                                th:data-desc="${co.description}"
                                th:data-course="${co.course != null ? co.course.id : ''}">
                            <i class="bi bi-pencil-square"></i> Edit
                        </button>
                        <a th:href="@{/deleteCO/{id}(id=${co.id})}"
                           class="btn btn-danger btn-sm text-nowrap"
                           onclick="return confirm('Are you sure you want to delete this Course Outcome?');">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${cos == null or cos.isEmpty()}">
                <td colspan="5" class="text-center text-muted py-3">No Course Outcomes defined yet.</td>
            </tr>
        </tbody>
    </table>

</div>

<!-- Edit CO Modal -->
<div class="modal fade" id="editCoModal" tabindex="-1" aria-labelledby="editCoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/updateCO" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCoModalLabel"><i class="bi bi-pencil-square me-1"></i> Edit Course Outcome</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editCoId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">CO Code</label>
                        <input type="text" name="coCode" id="editCoCode" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" id="editCoDescription" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course</label>
                        <select name="courseId" id="editCoCourseId" class="form-select" required>
                            <option value="">Select Course</option>
                            <option th:each="c : ${courses}"
                                    th:value="${c.id}"
                                    th:text="${c.courseCode + ' - ' + c.courseName}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('editCoModal');
        if (modal) {
            modal.addEventListener('show.bs.modal', function(event) {
                const btn = event.relatedTarget;
                document.getElementById('editCoId').value = btn.getAttribute('data-id');
                document.getElementById('editCoCode').value = btn.getAttribute('data-code');
                document.getElementById('editCoDescription').value = btn.getAttribute('data-desc');
                document.getElementById('editCoCourseId').value = btn.getAttribute('data-course');
            });
        }
    });
</script>

</body>
</html>
