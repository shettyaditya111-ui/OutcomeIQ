<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CO Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Course Outcome Management</h2>

<form action="/addCO" method="post">

    <input name="coCode" placeholder="CO Code"
           class="form-control mb-2" required>

    <input name="description" placeholder="CO Description"
           class="form-control mb-2" required>

    <select name="courseId" class="form-control mb-2" required>
        <option value="">Select Course</option>

        <option th:each="c : ${courses}"
                th:value="${c.id}"
                th:text="${c.courseName}">
        </option>
    </select>

    <button class="btn btn-primary">Add CO</button>

</form>

<hr>

<h4>Course Outcomes</h4>

<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>CO Code</th>
        <th>Description</th>
        <th>Course</th>
        <th>Action</th>
    </tr>

    <tr th:each="co : ${cos}">
        <td th:text="${co.id}"></td>
        <td th:text="${co.coCode}"></td>
        <td th:text="${co.description}"></td>
        <td th:text="${co.course.courseName}"></td>

        <td>
            <a th:href="@{/deleteCO/{id}(id=${co.id})}"
               class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>

</table>

<a href="/" class="btn btn-secondary">Home</a>

</body>
</html>
