<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Marks - OutcomeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

    <h2>Student Marks Management</h2>
    <hr>

    <!-- Add Marks Form -->
    <form action="/addMark" method="post">

        <select name="studentId" class="form-control mb-3" required>
            <option value="">Select Student</option>
            <option th:each="s : ${students}"
                    th:value="${s.id}"
                    th:text="${s.usn + ' - ' + s.studentName}">
            </option>
        </select>

        <select name="questionId" class="form-control mb-3" required>
            <option value="">Select Question</option>
            <option th:each="q : ${questions}"
                    th:value="${q.id}"
                    th:text="${q.questionText + ' (CO: ' + q.courseOutcome.coCode + ', Max Marks: ' + q.marks + ')'}">
            </option>
        </select>

        <input type="number"
               name="marksObtained"
               class="form-control mb-3"
               placeholder="Enter Marks Obtained"
               min="0"
               step="0.5"
               required>

        <button type="submit" class="btn btn-primary">
            Save Marks
        </button>

    </form>

    <hr>

    <!-- Marks List -->
    <h3>Recorded Student Marks</h3>

    <table class="table table-bordered mt-3">

        <thead>
            <tr>
                <th>ID</th>
                <th>Student USN</th>
                <th>Student Name</th>
                <th>Question</th>
                <th>CO</th>
                <th>Maximum Marks</th>
                <th>Obtained Marks</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="m : ${marks}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.student.usn}"></td>
                <td th:text="${m.student.studentName}"></td>
                <td th:text="${m.question.questionText}"></td>
                <td th:text="${m.question.courseOutcome.coCode}"></td>
                <td th:text="${m.question.marks}"></td>
                <td th:text="${m.marksObtained}"></td>

                <td>
                    <a th:href="@{/deleteMark/{id}(id=${m.id})}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>

    </table>

    <a href="/" class="btn btn-secondary">Home</a>

</body>
</html>
