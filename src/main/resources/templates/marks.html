<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks - OutcomeIQ</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .action-cell {
            white-space: nowrap !important;
            width: 150px;
            min-width: 150px;
        }
        .action-btn-group {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 6px !important;
            flex-wrap: nowrap !important;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h2>Student Marks Management</h2>
    <hr>

    <!-- Feedback messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Record / Update Marks Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0" id="markFormTitle">Record Student Mark</h5>
                <span id="existingRecordBadge" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle" style="display: none;">
                    <i class="bi bi-pencil-fill me-1"></i> Existing mark found: Submitting will update
                </span>
            </div>

            <form action="/addMark" method="post" id="markEntryForm" class="row g-2 align-items-end">

                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-secondary mb-1">Student <span class="text-danger">*</span></label>
                    <select name="studentId" id="mainStudentSelect" class="form-select" required>
                        <option value="">Select Student</option>
                        <option th:each="s : ${students}"
                                th:value="${s.id}"
                                th:text="${s.usn + ' - ' + s.studentName + (s.course != null ? ' (' + s.course.courseCode + ')' : '')}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-secondary mb-1">Question <span class="text-danger">*</span></label>
                    <select name="questionId" id="mainQuestionSelect" class="form-select" required>
                        <option value="">Select Question</option>
                        <option th:each="q : ${questions}"
                                th:value="${q.id}"
                                th:data-max="${q.marks}"
                                th:text="${q.questionText + ' (CO: ' + (q.courseOutcome != null ? q.courseOutcome.coCode : '-') + ', Max: ' + q.marks + 'm)'}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label small fw-semibold text-secondary mb-0">Marks Scored <span class="text-danger">*</span></label>
                        <small id="maxAllowedLabel" class="text-muted" style="font-size: 0.75rem;">Max: --</small>
                    </div>
                    <input type="number"
                           name="marksObtained"
                           id="mainMarksInput"
                           class="form-control"
                           placeholder="Marks"
                           min="0"
                           step="0.5"
                           required>
                    <div id="maxErrorMsg" class="small text-danger mt-1 fw-semibold" style="display: none; font-size: 0.75rem;"></div>
                </div>

                <div class="col-md-2">
                    <button type="submit" id="mainSubmitBtn" class="btn btn-primary w-100">
                        <i class="bi bi-check2-circle me-1" id="mainSubmitIcon"></i>
                        <span id="mainSubmitText">Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Marks List -->
    <h4>Recorded Student Marks</h4>

    <table class="table table-bordered table-hover align-middle mt-3">
        <thead class="table-light">
            <tr>
                <th style="width: 5%;">ID</th>
                <th style="width: 14%;">USN</th>
                <th style="width: 18%;">Student Name</th>
                <th style="width: 28%;">Question</th>
                <th style="width: 7%;">CO</th>
                <th style="width: 7%;">Max</th>
                <th style="width: 7%;">Scored</th>
                <th class="text-center text-nowrap" style="width: 1%;">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${marks}">
                <td th:text="${m.id}"></td>
                <td><strong class="text-primary" th:text="${m.student != null ? m.student.usn : '-'}"></strong></td>
                <td th:text="${m.student != null ? m.student.studentName : '-'}"></td>
                <td th:text="${m.question != null ? m.question.questionText : '-'}"></td>
                <td>
                    <span class="badge bg-primary" th:text="${m.question != null && m.question.courseOutcome != null ? m.question.courseOutcome.coCode : '-'}"></span>
                </td>
                <td th:text="${m.question != null ? m.question.marks : '-'}"></td>
                <td><strong class="text-success" th:text="${m.marksObtained}"></strong></td>
                <td class="text-center text-nowrap" style="white-space: nowrap !important;">
                    <div class="d-inline-flex gap-2 align-items-center">
                        <button type="button" class="btn btn-warning btn-sm text-nowrap"
                                data-bs-toggle="modal" data-bs-target="#editMarkModal"
                                th:data-id="${m.id}"
                                th:data-student="${m.student != null ? m.student.id : ''}"
                                th:data-question="${m.question != null ? m.question.id : ''}"
                                th:data-max="${m.question != null ? m.question.marks : 0}"
                                th:data-marks="${m.marksObtained}">
                            <i class="bi bi-pencil-square"></i> Edit
                        </button>
                        <a th:href="@{/deleteMark/{id}(id=${m.id})}"
                           class="btn btn-danger btn-sm text-nowrap"
                           onclick="return confirm('Are you sure you want to delete this mark record?');">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${marks == null or marks.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-3">No student marks recorded yet.</td>
            </tr>
        </tbody>
    </table>

</div>

<!-- Edit Mark Modal -->
<div class="modal fade" id="editMarkModal" tabindex="-1" aria-labelledby="editMarkModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/updateMark" method="post" id="editMarkForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="editMarkModalLabel"><i class="bi bi-pencil-square me-1"></i> Edit Student Mark</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editMarkId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Student</label>
                        <select name="studentId" id="editMarkStudentId" class="form-select" required>
                            <option value="">Select Student</option>
                            <option th:each="s : ${students}"
                                    th:value="${s.id}"
                                    th:text="${s.usn + ' - ' + s.studentName}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Question</label>
                        <select name="questionId" id="editMarkQuestionId" class="form-select" required>
                            <option value="">Select Question</option>
                            <option th:each="q : ${questions}"
                                    th:value="${q.id}"
                                    th:data-max="${q.marks}"
                                    th:text="${q.questionText + ' (Max: ' + q.marks + 'm)'}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold mb-0">Marks Obtained</label>
                            <small id="editMaxLabel" class="text-muted">Max: --</small>
                        </div>
                        <input type="number" name="marksObtained" id="editMarkObtained" class="form-control" min="0" step="0.5" required>
                        <div id="editMaxErrorMsg" class="small text-danger mt-1 fw-semibold" style="display: none;"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="editSaveBtn" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Build map of existing marks: "studentId_questionId" -> { id, marks, max }
        const existingMarks = {};
        /*[# th:each="m : ${marks}"]*/
        /*[# th:if="${m.student != null and m.question != null}"]*/
        existingMarks["/*[(${m.student.id})]*/" + "_" + "/*[(${m.question.id})]*/"] = {
            id: /*[(${m.id})]*/ 0,
            marks: /*[(${m.marksObtained})]*/ 0,
            max: /*[(${m.question.marks})]*/ 0
        };
        /*[/]*/
        /*[/]*/

        const studentSelect = document.getElementById('mainStudentSelect');
        const questionSelect = document.getElementById('mainQuestionSelect');
        const marksInput = document.getElementById('mainMarksInput');
        const maxAllowedLabel = document.getElementById('maxAllowedLabel');
        const maxErrorMsg = document.getElementById('maxErrorMsg');
        const submitBtn = document.getElementById('mainSubmitBtn');
        const submitText = document.getElementById('mainSubmitText');
        const submitIcon = document.getElementById('mainSubmitIcon');
        const badge = document.getElementById('existingRecordBadge');
        const form = document.getElementById('markEntryForm');

        function getCurrentMax() {
            const opt = questionSelect.options[questionSelect.selectedIndex];
            if (opt && opt.getAttribute('data-max')) {
                return parseFloat(opt.getAttribute('data-max'));
            }
            return null;
        }

        function checkStudentQuestionMatch() {
            const studentId = studentSelect.value;
            const questionId = questionSelect.value;
            const maxMarks = getCurrentMax();

            // Update max marks limit and placeholder
            if (maxMarks !== null && !isNaN(maxMarks)) {
                marksInput.max = maxMarks;
                maxAllowedLabel.textContent = 'Max: ' + maxMarks;
            } else {
                marksInput.removeAttribute('max');
                maxAllowedLabel.textContent = 'Max: --';
            }

            // Check if existing record exists
            if (studentId && questionId) {
                const key = studentId + "_" + questionId;
                if (existingMarks[key]) {
                    const record = existingMarks[key];
                    marksInput.value = record.marks;
                    badge.style.display = 'inline-block';
                    badge.textContent = 'Existing mark recorded: ' + record.marks + ' / ' + record.max + ' (Submitting will update)';
                    submitText.textContent = 'Update Mark';
                    submitIcon.className = 'bi bi-pencil-square me-1';
                    submitBtn.className = 'btn btn-warning w-100';
                } else {
                    badge.style.display = 'none';
                    submitText.textContent = 'Save';
                    submitIcon.className = 'bi bi-check2-circle me-1';
                    submitBtn.className = 'btn btn-primary w-100';
                }
            } else {
                badge.style.display = 'none';
                submitText.textContent = 'Save';
                submitIcon.className = 'bi bi-check2-circle me-1';
                submitBtn.className = 'btn btn-primary w-100';
            }

            validateEnteredMarks();
        }

        function validateEnteredMarks() {
            const max = getCurrentMax();
            const val = parseFloat(marksInput.value);

            if (max !== null && !isNaN(val) && val > max) {
                marksInput.classList.add('is-invalid');
                maxErrorMsg.textContent = 'Cannot exceed max marks (' + max + ')';
                maxErrorMsg.style.display = 'block';
                submitBtn.disabled = true;
                return false;
            } else {
                marksInput.classList.remove('is-invalid');
                maxErrorMsg.style.display = 'none';
                submitBtn.disabled = false;
                return true;
            }
        }

        studentSelect.addEventListener('change', checkStudentQuestionMatch);
        questionSelect.addEventListener('change', checkStudentQuestionMatch);
        marksInput.addEventListener('input', validateEnteredMarks);

        form.addEventListener('submit', function(e) {
            if (!validateEnteredMarks()) {
                e.preventDefault();
                alert('Marks entered cannot exceed maximum marks for the selected question.');
                return false;
            }
        });

        // ------------------ Edit Modal Validation ------------------
        const editModal = document.getElementById('editMarkModal');
        const editQuestionSelect = document.getElementById('editMarkQuestionId');
        const editMarksInput = document.getElementById('editMarkObtained');
        const editMaxLabel = document.getElementById('editMaxLabel');
        const editMaxErrorMsg = document.getElementById('editMaxErrorMsg');
        const editSaveBtn = document.getElementById('editSaveBtn');

        function getEditCurrentMax() {
            const opt = editQuestionSelect.options[editQuestionSelect.selectedIndex];
            if (opt && opt.getAttribute('data-max')) {
                return parseFloat(opt.getAttribute('data-max'));
            }
            return null;
        }

        function validateEditMarks() {
            const max = getEditCurrentMax();
            const val = parseFloat(editMarksInput.value);

            if (max !== null) {
                editMarksInput.max = max;
                editMaxLabel.textContent = 'Max: ' + max;
            }

            if (max !== null && !isNaN(val) && val > max) {
                editMarksInput.classList.add('is-invalid');
                editMaxErrorMsg.textContent = 'Cannot exceed max marks (' + max + ')';
                editMaxErrorMsg.style.display = 'block';
                editSaveBtn.disabled = true;
                return false;
            } else {
                editMarksInput.classList.remove('is-invalid');
                editMaxErrorMsg.style.display = 'none';
                editSaveBtn.disabled = false;
                return true;
            }
        }

        if (editModal) {
            editModal.addEventListener('show.bs.modal', function(event) {
                const btn = event.relatedTarget;
                document.getElementById('editMarkId').value = btn.getAttribute('data-id');
                document.getElementById('editMarkStudentId').value = btn.getAttribute('data-student');
                editQuestionSelect.value = btn.getAttribute('data-question');
                editMarksInput.value = btn.getAttribute('data-marks');
                validateEditMarks();
            });

            editQuestionSelect.addEventListener('change', validateEditMarks);
            editMarksInput.addEventListener('input', validateEditMarks);

            document.getElementById('editMarkForm').addEventListener('submit', function(e) {
                if (!validateEditMarks()) {
                    e.preventDefault();
                    alert('Marks entered cannot exceed maximum marks.');
                    return false;
                }
            });
        }
    });
</script>

</body>
</html>
