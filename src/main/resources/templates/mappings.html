<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CO-PO Mapping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>CO-PO Mapping Management</h2>
<form action="/addMapping" method="post">
    <select name="coId" class="form-control mb-2" required>
        <option value="">Select Course Outcome</option>
        <option th:each="co : ${cos}"
                th:value="${co.id}"
                th:text="${co.coCode}">
        </option>
    </select>
    <select name="poId" class="form-control mb-2" required>
        <option value="">Select Program Outcome</option>
        <option th:each="po : ${pos}"
                th:value="${po.id}"
                th:text="${po.poCode}">
        </option>
    </select>
    <select name="mappingStrength" class="form-control mb-2" required>
        <option value="">Select Mapping Strength</option>
        <option value="1">1 - Low</option>
        <option value="2">2 - Medium</option>
        <option value="3">3 - High</option>
    </select>
    <button type="submit" class="btn btn-primary">Add Mapping</button>
</form>
<hr>
<h4>CO-PO Mappings</h4>
<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Course Outcome</th>
        <th>Program Outcome</th>
        <th>Mapping Strength</th>
        <th>Action</th>
    </tr>
    <tr th:each="m : ${mappings}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.courseOutcome.coCode}"></td>
        <td th:text="${m.programOutcome.poCode}"></td>
        <td th:text="${m.mappingStrength}"></td>
        <td>
            <a th:href="@{/deleteMapping/{id}(id=${m.id})}"
               class="btn btn-danger">Delete</a>
        </td>
    </tr>
</table>
<a href="/" class="btn btn-secondary">Home</a>
</body>
</html>
