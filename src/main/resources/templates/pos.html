<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Program Outcome Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Program Outcome Management</h2>
<form action="/addPO" method="post">
    <input type="text" name="poCode" class="form-control mb-2"
           placeholder="PO Code" required>
    <input type="text" name="description" class="form-control mb-2"
           placeholder="PO Description" required>
    <button type="submit" class="btn btn-primary">Add PO</button>
</form>
<hr>
<h4>Program Outcomes</h4>
<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>PO Code</th>
        <th>Description</th>
        <th>Action</th>
    </tr>
    <tr th:each="po : ${pos}">
        <td th:text="${po.id}"></td>
        <td th:text="${po.poCode}"></td>
        <td th:text="${po.description}"></td>
        <td>
            <a th:href="@{/deletePO/{id}(id=${po.id})}"
               class="btn btn-danger">Delete</a>
        </td>
    </tr>
</table>
<a href="/" class="btn btn-secondary">Home</a>
</body>
</html>
