<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Outcome Management - OutcomeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h2>Program Outcome Management</h2>
    <hr>

    <!-- Feedback messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Add PO Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Add Program Outcome</h5>
            <form action="/addPO" method="post" class="row g-2">
                <div class="col-md-3">
                    <input type="text" name="poCode" class="form-control" placeholder="PO Code (e.g. PO1)" required>
                </div>
                <div class="col-md-7">
                    <input type="text" name="description" class="form-control" placeholder="Outcome Description (e.g. Engineering Knowledge)" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-plus-circle me-1"></i> Add PO
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- PO List -->
    <h4>Existing Program Outcomes</h4>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
            <tr>
                <th style="width: 8%;">ID</th>
                <th style="width: 18%;">PO Code</th>
                <th style="width: 54%;">Description</th>
                <th style="width: 20%;">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="po : ${pos}">
                <td th:text="${po.id}"></td>
                <td><strong class="text-primary" th:text="${po.poCode}"></strong></td>
                <td th:text="${po.description}"></td>
                <td>
                    <button type="button" class="btn btn-warning btn-sm me-1"
                            data-bs-toggle="modal" data-bs-target="#editPoModal"
                            th:data-id="${po.id}"
                            th:data-code="${po.poCode}"
                            th:data-desc="${po.description}">
                        <i class="bi bi-pencil-square"></i> Edit
                    </button>
                    <a th:href="@{/deletePO/{id}(id=${po.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this Program Outcome?');">
                        <i class="bi bi-trash"></i> Delete
                    </a>
                </td>
            </tr>
            <tr th:if="${pos == null or pos.isEmpty()}">
                <td colspan="4" class="text-center text-muted py-3">No Program Outcomes defined yet.</td>
            </tr>
        </tbody>
    </table>

</div>

<!-- Edit PO Modal -->
<div class="modal fade" id="editPoModal" tabindex="-1" aria-labelledby="editPoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/updatePO" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="editPoModalLabel"><i class="bi bi-pencil-square me-1"></i> Edit Program Outcome</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editPoId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">PO Code</label>
                        <input type="text" name="poCode" id="editPoCode" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" id="editPoDescription" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('editPoModal');
        if (modal) {
            modal.addEventListener('show.bs.modal', function(event) {
                const btn = event.relatedTarget;
                document.getElementById('editPoId').value = btn.getAttribute('data-id');
                document.getElementById('editPoCode').value = btn.getAttribute('data-code');
                document.getElementById('editPoDescription').value = btn.getAttribute('data-desc');
            });
        }
    });
</script>

</body>
</html>
