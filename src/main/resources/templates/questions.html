<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - OutcomeIQ</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h2>Question Bank Management</h2>
    <hr>

    <!-- Feedback messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Add Question Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Add New Question</h5>
            <form action="/addQuestion" method="post">

                <textarea name="questionText"
                          class="form-control mb-3"
                          placeholder="Enter Question text..."
                          rows="2"
                          required></textarea>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <select name="courseId" id="addCourseSelect" class="form-select" required>
                            <option value="">Select Course</option>
                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.courseCode + ' - ' + course.courseName}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <select name="coId" id="addCoSelect" class="form-select" required>
                            <option value="">Select Course Outcome</option>
                            <option th:each="co : ${cos}"
                                    th:value="${co.id}"
                                    th:data-course="${co.course != null ? co.course.id : ''}"
                                    th:text="${co.coCode + (co.course != null ? ' (' + co.course.courseCode + ')' : '')}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <select name="bloomLevel" class="form-select" required>
                            <option value="">Select Bloom's Level</option>
                            <option value="Remember">Remember (L1)</option>
                            <option value="Understand">Understand (L2)</option>
                            <option value="Apply">Apply (L3)</option>
                            <option value="Analyze">Analyze (L4)</option>
                            <option value="Evaluate">Evaluate (L5)</option>
                            <option value="Create">Create (L6)</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select name="assessmentType" class="form-select" required>
                            <option value="">Select Assessment Type</option>
                            <option value="CIE">CIE (Internal)</option>
                            <option value="SEE">SEE (Semester End)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="marks"
                               class="form-control"
                               placeholder="Max Marks"
                               min="1" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="yearUsed"
                               class="form-control"
                               placeholder="Year (e.g. 2026)"
                               min="1900" max="2099">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i> Add Question
                </button>

            </form>
        </div>
    </div>

    <!-- Question List -->
    <h4>Stored Questions</h4>

    <table class="table table-bordered table-hover align-middle mt-3">
        <thead class="table-light">
            <tr>
                <th style="width: 5%;">ID</th>
                <th style="width: 40%;">Question</th>
                <th style="width: 12%;">Course</th>
                <th style="width: 8%;">CO</th>
                <th style="width: 12%;">Bloom Level</th>
                <th style="width: 8%;">Marks</th>
                <th class="text-center text-nowrap" style="width: 1%;">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="q : ${questions}">
                <td th:text="${q.id}"></td>
                <td style="white-space: pre-wrap;" th:text="${q.questionText}"></td>
                <td th:text="${q.course != null ? q.course.courseCode : '-'}"></td>
                <td>
                    <span class="badge bg-primary" th:text="${q.courseOutcome != null ? q.courseOutcome.coCode : '-'}"></span>
                </td>
                <td th:text="${q.bloomLevel}"></td>
                <td><strong th:text="${q.marks}"></strong></td>
                <td class="text-center text-nowrap" style="white-space: nowrap !important;">
                    <div class="d-inline-flex gap-2 align-items-center">
                        <button type="button" class="btn btn-warning btn-sm text-nowrap"
                                data-bs-toggle="modal" data-bs-target="#editQuestionModal"
                                th:data-id="${q.id}"
                                th:data-text="${q.questionText}"
                                th:data-course="${q.course != null ? q.course.id : ''}"
                                th:data-co="${q.courseOutcome != null ? q.courseOutcome.id : ''}"
                                th:data-bloom="${q.bloomLevel}"
                                th:data-marks="${q.marks}"
                                th:data-type="${q.assessmentType}"
                                th:data-year="${q.yearUsed}">
                            <i class="bi bi-pencil-square"></i> Edit
                        </button>
                        <a th:href="@{/deleteQuestion/{id}(id=${q.id})}"
                           class="btn btn-danger btn-sm text-nowrap"
                           onclick="return confirm('Are you sure you want to delete this question?');">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${questions == null or questions.isEmpty()}">
                <td colspan="7" class="text-center text-muted py-3">No questions stored in the bank yet.</td>
            </tr>
        </tbody>
    </table>

</div>

<!-- Edit Question Modal -->
<div class="modal fade" id="editQuestionModal" tabindex="-1" aria-labelledby="editQuestionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form action="/updateQuestion" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="editQuestionModalLabel"><i class="bi bi-pencil-square me-1"></i> Edit Question</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editQId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Question Text</label>
                        <textarea name="questionText" id="editQText" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Course</label>
                            <select name="courseId" id="editQCourse" class="form-select" required>
                                <option value="">Select Course</option>
                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.courseCode + ' - ' + course.courseName}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Course Outcome</label>
                            <select name="coId" id="editQCo" class="form-select" required>
                                <option value="">Select Course Outcome</option>
                                <option th:each="co : ${cos}"
                                        th:value="${co.id}"
                                        th:data-course="${co.course != null ? co.course.id : ''}"
                                        th:text="${co.coCode + (co.course != null ? ' (' + co.course.courseCode + ')' : '')}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Bloom's Level</label>
                            <select name="bloomLevel" id="editQBloom" class="form-select" required>
                                <option value="Remember">Remember (L1)</option>
                                <option value="Understand">Understand (L2)</option>
                                <option value="Apply">Apply (L3)</option>
                                <option value="Analyze">Analyze (L4)</option>
                                <option value="Evaluate">Evaluate (L5)</option>
                                <option value="Create">Create (L6)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Assessment Type</label>
                            <select name="assessmentType" id="editQType" class="form-select" required>
                                <option value="CIE">CIE (Internal)</option>
                                <option value="SEE">SEE (Semester End)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">Max Marks</label>
                            <input type="number" name="marks" id="editQMarks" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Year Used</label>
                            <input type="number" name="yearUsed" id="editQYear" class="form-control" min="1900" max="2099">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('editQuestionModal');
        if (modal) {
            modal.addEventListener('show.bs.modal', function(event) {
                const btn = event.relatedTarget;
                document.getElementById('editQId').value = btn.getAttribute('data-id');
                document.getElementById('editQText').value = btn.getAttribute('data-text');
                document.getElementById('editQCourse').value = btn.getAttribute('data-course');
                document.getElementById('editQCo').value = btn.getAttribute('data-co');
                document.getElementById('editQBloom').value = btn.getAttribute('data-bloom');
                document.getElementById('editQMarks').value = btn.getAttribute('data-marks');
                document.getElementById('editQType').value = btn.getAttribute('data-type') || 'CIE';
                document.getElementById('editQYear').value = btn.getAttribute('data-year') || '';
            });
        }
    });
</script>

</body>
</html>
