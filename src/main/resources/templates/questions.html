<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Question Bank - OutcomeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

    <h2>Question Bank Management</h2>
    <hr>

    <!-- Add Question Form -->
    <form action="/addQuestion" method="post">

        <textarea name="questionText"
                  class="form-control mb-3"
                  placeholder="Enter Question"
                  required></textarea>

        <select name="courseId" class="form-control mb-3" required>
            <option value="">Select Course</option>
            <option th:each="course : ${courses}"
                    th:value="${course.id}"
                    th:text="${course.courseCode + ' - ' + course.courseName}">
            </option>
        </select>

        <select name="coId" class="form-control mb-3" required>
            <option value="">Select Course Outcome</option>
            <option th:each="co : ${cos}"
                    th:value="${co.id}"
                    th:text="${co.coCode}">
            </option>
        </select>

        <select name="bloomLevel" class="form-control mb-3" required>
            <option value="">Select Bloom's Level</option>
            <option value="Remember">Remember</option>
            <option value="Understand">Understand</option>
            <option value="Apply">Apply</option>
            <option value="Analyze">Analyze</option>
            <option value="Evaluate">Evaluate</option>
            <option value="Create">Create</option>
        </select>

        <input type="number" name="marks"
               class="form-control mb-3"
               placeholder="Maximum Marks"
               min="1" required>

        <button type="submit" class="btn btn-primary">
            Add Question
        </button>

    </form>

    <hr>

    <!-- Question List -->
    <h3>Stored Questions</h3>

    <table class="table table-bordered mt-3">

        <thead>
            <tr>
                <th>ID</th>
                <th>Question</th>
                <th>Course</th>
                <th>CO</th>
                <th>Bloom's Level</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="q : ${questions}">
                <td th:text="${q.id}"></td>
                <td th:text="${q.questionText}"></td>
                <td th:text="${q.course.courseCode}"></td>
                <td th:text="${q.courseOutcome.coCode}"></td>
                <td th:text="${q.bloomLevel}"></td>
                <td th:text="${q.marks}"></td>
                <td>
                    <a th:href="@{/deleteQuestion/{id}(id=${q.id})}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>

    </table>

    <a href="/" class="btn btn-secondary">Home</a>

</body>
</html>
