<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Course Management</h2>

<form action="/addCourse" method="post" class="mb-4">

    <input name="courseCode" placeholder="Course Code" required class="form-control mb-2">

    <input name="courseName" placeholder="Course Name" required class="form-control mb-2">

    <input name="semester" placeholder="Semester" required class="form-control mb-2">

    <button class="btn btn-primary">Add Course</button>

</form>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Code</th>
    <th>Course Name</th>
    <th>Semester</th>
    <th>Action</th>
</tr>

<tr th:each="c : ${courses}">
    <td th:text="${c.id}"></td>
    <td th:text="${c.courseCode}"></td>
    <td th:text="${c.courseName}"></td>
    <td th:text="${c.semester}"></td>
    <td>
        <a th:href="@{/deleteCourse/{id}(id=${c.id})}" class="btn btn-danger btn-sm">Delete</a>
    </td>
</tr>

</table>

<a href="/" class="btn btn-secondary">Home</a>

</body>
</html>
