<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - OutcomeIQ</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <h2>Course Management</h2>
    <hr>

    <!-- Feedback messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Add Course Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Add New Course</h5>
            <form action="/addCourse" method="post" class="row g-2">
                <div class="col-md-3">
                    <input name="courseCode" placeholder="Course Code (e.g. CS301)" required class="form-control">
                </div>
                <div class="col-md-5">
                    <input name="courseName" placeholder="Course Name" required class="form-control">
                </div>
                <div class="col-md-2">
                    <input name="semester" placeholder="Semester (e.g. 5)" required class="form-control">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100">
                        <i class="bi bi-plus-circle me-1"></i> Add Course
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Course List -->
    <h4>Existing Courses</h4>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
            <tr>
                <th style="width: 8%;">ID</th>
                <th style="width: 20%;">Code</th>
                <th style="width: 44%;">Course Name</th>
                <th style="width: 14%;">Semester</th>
                <th class="text-center text-nowrap" style="width: 1%;">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${courses}">
                <td th:text="${c.id}"></td>
                <td><strong th:text="${c.courseCode}"></strong></td>
                <td th:text="${c.courseName}"></td>
                <td th:text="${c.semester}"></td>
                <td class="text-center text-nowrap" style="white-space: nowrap !important;">
                    <div class="d-inline-flex gap-2 align-items-center">
                        <button type="button" class="btn btn-warning btn-sm text-nowrap"
                                data-bs-toggle="modal" data-bs-target="#editCourseModal"
                                th:data-id="${c.id}"
                                th:data-code="${c.courseCode}"
                                th:data-name="${c.courseName}"
                                th:data-semester="${c.semester}">
                            <i class="bi bi-pencil-square"></i> Edit
                        </button>
                        <a th:href="@{/deleteCourse/{id}(id=${c.id})}"
                           class="btn btn-danger btn-sm text-nowrap"
                           onclick="return confirm('Are you sure you want to delete this course?');">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${courses == null or courses.isEmpty()}">
                <td colspan="5" class="text-center text-muted py-3">No courses registered yet.</td>
            </tr>
        </tbody>
    </table>

</div>

<!-- Edit Course Modal -->
<div class="modal fade" id="editCourseModal" tabindex="-1" aria-labelledby="editCourseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/updateCourse" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCourseModalLabel"><i class="bi bi-pencil-square me-1"></i> Edit Course</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editCourseId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Code</label>
                        <input type="text" name="courseCode" id="editCourseCode" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Name</label>
                        <input type="text" name="courseName" id="editCourseName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Semester</label>
                        <input type="text" name="semester" id="editCourseSemester" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('editCourseModal');
        if (modal) {
            modal.addEventListener('show.bs.modal', function(event) {
                const btn = event.relatedTarget;
                document.getElementById('editCourseId').value = btn.getAttribute('data-id');
                document.getElementById('editCourseCode').value = btn.getAttribute('data-code');
                document.getElementById('editCourseName').value = btn.getAttribute('data-name');
                document.getElementById('editCourseSemester').value = btn.getAttribute('data-semester');
            });
        }
    });
</script>

</body>
</html>
